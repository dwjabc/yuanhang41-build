name: Diagnose vendor images (EROFS)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install erofs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils file xxd

      - name: Download vendor images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p imgs
          gh release download inputs --repo "$GITHUB_REPOSITORY" \
            --pattern 'vendor.img' --pattern 'odm.img' --pattern 'vendor_dlkm.img' --dir imgs
          ls -la imgs

      - name: Extract EROFS images
        run: |
          for img in imgs/vendor.img imgs/odm.img imgs/vendor_dlkm.img; do
            name=$(basename "$img" .img)
            echo "== $name file list =="
            dump.erofs "$img" | head -400 | tee "out/${name}-filelist.txt"
            mkdir -p "ex/$name"
            fsck.erofs --extract="ex/$name" "$img" > "out/${name}-fsck.log" 2>&1 || \
              echo "fsck extract failed for $name (see log)"
          done
          echo "== key firmware files =="
          find ex -iname '*wcnmodem*' -o -iname '*gnssmodem*' -o -iname '*gcore*' \
               -o -iname '*sitronix*' -o -iname '*chipone*' -o -iname '*tpd*' \
               -o -iname '*touch*' -o -iname '*lcd*' -o -iname '*panel*' \
               -o -iname 'build.prop' -o -iname '*marlin*' | tee out/key-files.txt

      - name: Identify WiFi chip
        run: |
          for f in $(find ex -iname '*wcnmodem*' -o -iname '*gnssmodem*'); do
            echo "== $f =="
            file "$f"
            strings -n 8 "$f" | grep -iaE 'marlin|uwe|sdio|wifi|version|wcn|gnss' | sort -u | head -40 | tee -a out/key-files.txt || true
          done

      - name: Dump vendor build.prop and touch/lcd configs
        run: |
          mkdir -p out/props
          find ex -name 'build.prop' -exec sh -c 'cp "$1" "out/props/$(echo "$1" | tr "/" "_")"' _ {} \; 2>/dev/null || true
          find ex -path '*firmware*' -name '*.bin' -size -2M -exec sh -c 'cp "$1" out/props/fw_$(basename "$1")' _ {} \; 2>/dev/null || true
          find ex -iname '*tp*' -name '*.ini' -o -iname '*tp*' -name '*.conf' 2>/dev/null | head -20 | while read f; do cp "$f" out/props/ 2>/dev/null || true; done
          ls -la out/props | head -30

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: vendor-diagnostics
          path: |
            out/**
            ex/vendor_dlkm/**
            ex/odm/etc/**
            ex/vendor/firmware/**
            ex/vendor/build.prop
          compression-level: 0
          if-no-files-found: warn
